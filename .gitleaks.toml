# gitleaks config: the default rules plus the secrets this project uses (S-01).
# Loaded automatically from the repo root by pre-commit and CI.

[extend]
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''sk-or-v1-[0-9a-f]{64}'''
keywords = ["sk-or-v1-"]
